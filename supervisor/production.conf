# Supervisor Configuration v3 - Production
# Clean, minimal configuration using YAML-based config system

[unix_http_server]
file=%(ENV_PROJECT_ROOT)s/supervisor.sock

[supervisord]
logfile=%(ENV_PROJECT_ROOT)s/logs/supervisord.log
pidfile=%(ENV_PROJECT_ROOT)s/supervisord.pid
childlogdir=%(ENV_PROJECT_ROOT)s/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_PROJECT_ROOT)s/supervisor.sock

[program:ib-stream-prod]
command=%(ENV_PROJECT_ROOT)s/.venv/bin/uvicorn ib_stream.api_server:app --host 0.0.0.0 --port 8851
directory=%(ENV_PROJECT_ROOT)s/ib-stream
environment=IB_ENVIRONMENT=production,IB_CONFIG_ROOT=%(ENV_PROJECT_ROOT)s/config
autostart=true
autorestart=true
startretries=3
user=%(ENV_USER)s
stdout_logfile=%(ENV_PROJECT_ROOT)s/logs/ib-stream-prod-stdout.log
stderr_logfile=%(ENV_PROJECT_ROOT)s/logs/ib-stream-prod-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:ib-contract-prod]
command=%(ENV_PROJECT_ROOT)s/.venv/bin/uvicorn api_server:app --host 0.0.0.0 --port 8861
directory=%(ENV_PROJECT_ROOT)s/ib-contract  
environment=IB_ENVIRONMENT=production,IB_CONFIG_ROOT=%(ENV_PROJECT_ROOT)s/config
autostart=true
autorestart=true
startretries=3
user=%(ENV_USER)s
stdout_logfile=%(ENV_PROJECT_ROOT)s/logs/ib-contract-prod-stdout.log
stderr_logfile=%(ENV_PROJECT_ROOT)s/logs/ib-contract-prod-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5