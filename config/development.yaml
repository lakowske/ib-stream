# Configuration v3 - Development Environment
# Overrides for development environment

project:
  environment: development

gateway:
  host: 192.168.0.60  # Remote gateway for development

storage:
  base_path: storage
  formats:
    v2_json: false     # Disabled - using V3 only
    v2_protobuf: false # Disabled - using V3 only
    v3_json: true      # Enabled
    v3_protobuf: true  # Enabled
  enable_postgres: false  # No database in development
  
logging:
  level: DEBUG
  
performance:
  max_concurrent_streams: 10  # Lower limits for development